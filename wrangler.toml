# The workers.dev hostname is <name>.<account subdomain>.workers.dev, so this
# name is what puts the site on tech-media-sound-station.tmclassweb.workers.dev.
name = "tech-media-sound-station"
compatibility_date = "2026-08-28"
workers_dev = true

# Cloudflare Workers CI often runs `npx wrangler deploy` only. Wrangler runs this
# before uploading static assets (same command as root `npm run build:web`).
[build]
command = "npm run build:web"

[assets]
directory = "./uni-preset-vue-vite/uni-preset-vue-vite/dist/build/h5"
not_found_handling = "single-page-application"
