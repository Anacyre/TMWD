# The workers.dev hostname is <name>.<account subdomain>.workers.dev, so this
# name is what puts the site on tech-media-sound-station.tmclassweb.workers.dev.
name = "tech-media-sound-station"
compatibility_date = "2026-08-28"
workers_dev = true

# Cloudflare's builder is Linux and only installs this repo's root packages.
# build:web installs the H5 app (so `uni` exists) and then builds it.
[build]
command = "npm run build:web"

[assets]
directory = "./uni-preset-vue-vite/uni-preset-vue-vite/dist/build/h5"
not_found_handling = "single-page-application"
